[project]
name = "regime-engine"
version = "1.2.0"
description = "Replication package for 'Same Formula, Different Signal: Funding-Rate Censoring and Regime Dynamics in Decentralised Perpetual Futures'"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Gregor Albiez", email = "gregor.albiez@students.fhnw.ch"}]
keywords = ["funding rates", "perpetual futures", "censoring", "regime switching",
            "hidden Markov models", "Hyperliquid", "Binance", "Bybit"]
# Tested on CPython 3.9.6. Every module carries `from __future__ import
# annotations`, so nothing in the package needs 3.10+.
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26,<3.0",
    "scipy>=1.11",
    "pandas>=2.1",
    "statsmodels>=0.14,<0.15",
    "matplotlib>=3.8",
]

[project.urls]
Repository = "https://github.com/gelatotrade/HMM-Decentralised-Perpetual-Futures"

[project.optional-dependencies]
fetch = ["requests>=2.31", "pyarrow>=15.0", "boto3>=1.34", "lz4>=4.3"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]          # so `pytest` imports regime_engine without install
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
